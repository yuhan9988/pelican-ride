<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>鹈鹕骑车</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: full-bleed WebGL coast road; a title/stat card top-left, camera switch top-right, control dock along the bottom edge. One committed dusk-coast look. */
:root {
  --ink: #0d2630;
  --panel: rgba(10, 32, 40, 0.66);
  --panel-line: rgba(190, 226, 222, 0.16);
  --fg: #f3efe6;
  --muted: #9fbcbd;
  --pouch: #f4a53c;
  --sea: #3cb3a5;
  --display: "ZCOOL KuaiLe", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --body: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; background: var(--ink); color: var(--fg);
  font-family: var(--body); font-size: 14px; -webkit-font-smoothing: antialiased;
}
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

.topbar {
  position: fixed; left: 0; right: 0; top: 0;
  padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px 0;
  display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 12px;
  pointer-events: none;
}
.topbar > * { pointer-events: auto; }
.card {
  background: var(--panel); border: 1px solid var(--panel-line); border-radius: 14px;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.title { padding: 14px 18px 14px; display: grid; gap: 10px; min-width: 0; max-width: 100%; }
.title h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 32px; line-height: 1; letter-spacing: 0.04em; text-wrap: balance; }
.title h1 span { color: var(--pouch); }
.title p { margin: 0; color: var(--muted); font-size: 12px; letter-spacing: 0.06em; }
.stats { display: grid; grid-template-columns: repeat(5, auto); gap: 4px 18px; }
.stat { display: grid; gap: 2px; min-width: 0; }
.stat dt { font-size: 11px; color: var(--muted); letter-spacing: 0.08em; }
.stat dd { margin: 0; font-family: var(--mono); font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat dd small { font-size: 11px; font-weight: 500; color: var(--muted); margin-left: 2px; }
.stat.fish dd { color: var(--pouch); }

.cams { display: flex; padding: 4px; gap: 2px; flex-wrap: wrap; }
.cams button { flex: 1 1 auto; }

button, .chip {
  font: inherit; font-size: 13px; color: var(--fg); background: transparent;
  border: 1px solid transparent; border-radius: 10px; padding: 7px 12px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  transition: background .15s, border-color .15s, color .15s;
}
button:hover { background: rgba(255, 255, 255, 0.08); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--pouch); outline-offset: 2px; }
button[aria-pressed="true"] { background: var(--fg); color: var(--ink); }
kbd {
  font-family: var(--mono); font-size: 10px; line-height: 1; padding: 3px 5px; border-radius: 5px;
  border: 1px solid currentColor; opacity: 0.6;
}

.dock {
  position: fixed; left: 0; right: 0; bottom: 0;
  padding: 0 16px calc(env(safe-area-inset-bottom, 0px) + 16px);
  display: flex; justify-content: center; pointer-events: none;
}
.dock .card {
  pointer-events: auto; padding: 10px 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px;
  max-width: 100%;
}
.slider { display: grid; gap: 4px; min-width: 0; }
.slider label { display: flex; justify-content: space-between; gap: 12px; font-size: 11px; color: var(--muted); letter-spacing: 0.06em; }
.slider output { font-family: var(--mono); color: var(--fg); font-variant-numeric: tabular-nums; }
input[type="range"] { width: 170px; max-width: 100%; accent-color: var(--pouch); }
.sep { width: 1px; align-self: stretch; background: var(--panel-line); }
.actions { display: flex; flex-wrap: wrap; gap: 4px; }
.actions button { border-color: var(--panel-line); }
.actions .primary { background: var(--pouch); color: var(--ink); border-color: var(--pouch); font-weight: 700; }
.actions .primary:hover { background: #ffb85a; }
.toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); cursor: pointer; }
.toggle input { accent-color: var(--sea); }
.steer { display: none; gap: 4px; }
.steer button { border-color: var(--panel-line); font-size: 16px; padding: 7px 16px; touch-action: none; user-select: none; -webkit-user-select: none; }
@media (pointer: coarse) { .steer { display: flex; } .actions kbd { display: none; } }

.toast {
  position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%) scale(.9);
  font-family: var(--display); font-size: 28px; color: var(--fg); text-shadow: 0 2px 18px rgba(0,0,0,.45);
  opacity: 0; transition: opacity .25s, transform .35s cubic-bezier(.2,1.6,.4,1); pointer-events: none; text-align: center;
  max-width: calc(100% - 32px);
}
.toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
.fail { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; text-align: center; color: var(--muted); }

@media (max-width: 720px) {
  .title h1 { font-size: 24px; }
  .stats { grid-template-columns: repeat(3, auto); }
  .stat dd { font-size: 15px; }
  .cams { width: 100%; }
  input[type="range"] { width: 130px; }
  .sep { display: none; }
  .dock .card { padding: 8px 10px; gap: 8px 12px; justify-content: center; }
}
@media (max-width: 420px) { .title p { display: none; } }
</style>

<canvas id="scene" aria-label="三维场景：一只戴头盔的鹈鹕在海边公路上骑自行车"></canvas>

<div class="topbar">
  <section class="card title" aria-label="骑行数据">
    <div>
      <h1>鹈鹕<span>骑车</span></h1>
      <p>海岸一号公路 · 鹈鹕专用道</p>
    </div>
    <dl class="stats">
      <div class="stat"><dt>速度</dt><dd id="sSpeed">0<small>km/h</small></dd></div>
      <div class="stat"><dt>踏频</dt><dd id="sCad">0<small>rpm</small></dd></div>
      <div class="stat"><dt>里程</dt><dd id="sDist">0.00<small>km</small></dd></div>
      <div class="stat fish"><dt>渔获</dt><dd id="sFish">0<small>条</small></dd></div>
      <div class="stat"><dt>时刻</dt><dd id="sTime">17:36</dd></div>
    </dl>
  </section>
  <nav class="card cams" aria-label="镜头">
    <button data-cam="follow" aria-pressed="true">跟随 <kbd>1</kbd></button>
    <button data-cam="side" aria-pressed="false">侧面 <kbd>2</kbd></button>
    <button data-cam="cine" aria-pressed="false">环绕 <kbd>3</kbd></button>
    <button data-cam="pov" aria-pressed="false">鹈鹕视角 <kbd>4</kbd></button>
    <button data-cam="free" aria-pressed="false">自由 <kbd>5</kbd></button>
  </nav>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="dock">
  <div class="card">
    <div class="slider">
      <label for="speed">车速 <kbd>W</kbd><kbd>S</kbd> <output id="speedOut" for="speed">22 km/h</output></label>
      <input id="speed" type="range" min="0" max="45" step="1" value="22">
    </div>
    <div class="slider">
      <label for="tod">时间 <output id="todOut" for="tod">17:36</output></label>
      <input id="tod" type="range" min="0" max="24" step="0.05" value="17.6">
    </div>
    <label class="toggle"><input id="autoTime" type="checkbox"> 时间流动</label>
    <span class="sep"></span>
    <div class="steer" aria-label="转向">
      <button id="steerL" aria-label="向左">◀</button>
      <button id="steerR" aria-label="向右">▶</button>
    </div>
    <div class="actions">
      <button class="primary" id="btnFish">接鱼 <kbd>空格</kbd></button>
      <button id="btnBell">打铃 <kbd>B</kbd></button>
      <button id="btnWave">挥翅 <kbd>H</kbd></button>
      <button id="btnPause" aria-pressed="false">暂停 <kbd>P</kbd></button>
      <button id="btnSound" aria-pressed="false">声音 关</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
  const $ = (s) => document.querySelector(s);
  if (!window.THREE) {
    document.body.insertAdjacentHTML('beforeend', '<div class="fail">3D 引擎没有加载出来。请检查网络后刷新页面。</div>');
    return;
  }
  const V3 = THREE.Vector3;
  const UP = new V3(0, 1, 0), XAX = new V3(1, 0, 0);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  let seed = 7;
  const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const rr = (a, b) => a + rnd() * (b - a);
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- renderer ----------
  const canvas = $('#scene');
  let renderer;
  try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true }); }
  catch (e) {
    document.body.insertAdjacentHTML('beforeend', '<div class="fail">这台设备的浏览器没有开启 WebGL，无法显示 3D 场景。</div>');
    return;
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;

  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0xff9a5c, 28, 110);
  const camera = new THREE.PerspectiveCamera(50, 1, 0.05, 900);
  camera.position.set(3.4, 1.7, 2.6);

  function resize() {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.fov = w < h ? 68 : 50;
    camera.updateProjectionMatrix();
  }
  addEventListener('resize', resize);
  resize();

  // ---------- helpers ----------
  const mat = (color, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.75, metalness: 0 }, o));
  const flat = (color, o = {}) => mat(color, Object.assign({ flatShading: true }, o));
  const cylGeo = (rt, rb, seg = 12) => new THREE.CylinderGeometry(rt, rb, 1, seg);
  const sphGeo = new THREE.SphereGeometry(0.5, 20, 14);
  const tmpV = new V3();
  function placeBetween(mesh, a, b) {
    tmpV.subVectors(b, a);
    const len = tmpV.length() || 1e-4;
    mesh.position.addVectors(a, b).multiplyScalar(0.5);
    mesh.quaternion.setFromUnitVectors(UP, tmpV.divideScalar(len));
    mesh.scale.y = len;
    return mesh;
  }
  function tube(a, b, r, m, parent, r2) {
    const mesh = new THREE.Mesh(cylGeo(r2 ?? r, r), m);
    placeBetween(mesh, a, b);
    mesh.castShadow = true;
    parent.add(mesh);
    return mesh;
  }
  function ellipsoid(a, b, w, t, m, parent) {
    const mesh = new THREE.Mesh(sphGeo, m);
    placeBetween(mesh, a, b);
    mesh.scale.x = w; mesh.scale.z = t;
    mesh.castShadow = true;
    parent.add(mesh);
    return mesh;
  }
  function blob(pos, sx, sy, sz, m, parent) {
    const mesh = new THREE.Mesh(sphGeo, m);
    mesh.position.copy(pos); mesh.scale.set(sx * 2, sy * 2, sz * 2);
    mesh.castShadow = true;
    parent.add(mesh);
    return mesh;
  }
  function canvasTex(w, h, draw, rx = 1, ry = 1) {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    draw(c.getContext('2d'), w, h);
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(rx, ry);
    t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return t;
  }
  function speckle(g, w, h, n, cols, size = 2) {
    for (let i = 0; i < n; i++) { g.fillStyle = cols[(rnd() * cols.length) | 0]; g.fillRect(rnd() * w, rnd() * h, size * rnd() + 0.6, size * rnd() + 0.6); }
  }
  function glowTexture(inner, outer) {
    return canvasTex(128, 128, (g) => {
      const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
      gr.addColorStop(0, inner); gr.addColorStop(0.35, outer); gr.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
    });
  }

  // ---------- sky ----------
  const skyU = {
    top: { value: new THREE.Color() }, hor: { value: new THREE.Color() }, bot: { value: new THREE.Color(0x1a3a44) },
    sunDir: { value: new V3(1, 0.1, 0) }, sunCol: { value: new THREE.Color() }, moonVis: { value: 0 }, cam: { value: new V3() }
  };
  const sky = new THREE.Mesh(new THREE.SphereGeometry(500, 32, 16), new THREE.ShaderMaterial({
    uniforms: skyU, side: THREE.BackSide, depthWrite: false, fog: false,
    vertexShader: 'varying vec3 vW; void main(){ vec4 w = modelMatrix*vec4(position,1.); vW = w.xyz; gl_Position = projectionMatrix*viewMatrix*w; }',
    fragmentShader: `
      uniform vec3 top, hor, bot, sunCol, sunDir, cam; uniform float moonVis; varying vec3 vW;
      void main(){
        vec3 d = normalize(vW - cam);
        float h = d.y;
        vec3 c = h > 0. ? mix(hor, top, pow(clamp(h,0.,1.), .55)) : mix(hor, bot, clamp(-h*4.,0.,1.));
        float s = max(dot(d, normalize(sunDir)), 0.);
        c += sunCol * (pow(s, 900.) * 2.5 + pow(s, 14.) * .32 + pow(s, 3.) * .08);
        float m = max(dot(d, -normalize(sunDir)), 0.);
        c += vec3(.92,.94,1.) * moonVis * (smoothstep(.9994,.9997,m) * 1.2 + pow(m, 60.) * .12);
        gl_FragColor = vec4(c, 1.);
      }`
  }));
  sky.renderOrder = -1;
  scene.add(sky);

  const starGeo = new THREE.BufferGeometry();
  { const p = []; for (let i = 0; i < 1400; i++) { const th = rnd() * Math.PI * 2, y = rr(0.04, 1); const r = Math.sqrt(1 - y * y); p.push(Math.cos(th) * r * 450, y * 450, Math.sin(th) * r * 450); } starGeo.setAttribute('position', new THREE.Float32BufferAttribute(p, 3)); }
  const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 1.6, sizeAttenuation: false, transparent: true, opacity: 0, fog: false, depthWrite: false }));
  scene.add(stars);

  // ---------- lights ----------
  const hemi = new THREE.HemisphereLight(0xbfdcff, 0x5a4a35, 0.6);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xffffff, 1.5);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -9, right: 9, top: 9, bottom: -9, near: 1, far: 80 });
  sun.shadow.bias = -0.0004;
  sun.shadow.normalBias = 0.02;
  scene.add(sun, sun.target);

  // ---------- ground ----------
  const roadTex = canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = '#3a3d43'; g.fillRect(0, 0, w, h);
    speckle(g, w, h, 4000, ['#2f3237', '#474a51', '#53565c', '#34373c']);
    g.fillStyle = '#efe5c8'; g.fillRect(125, 0, 6, 140);
    g.fillStyle = '#e9dfc3'; g.fillRect(10, 0, 5, h); g.fillRect(w - 15, 0, 5, h);
  }, 1, 40);
  const road = new THREE.Mesh(new THREE.PlaneGeometry(3.2, 200).rotateX(-Math.PI / 2), mat(0xffffff, { map: roadTex, roughness: 0.92 }));
  road.position.y = 0.005; road.receiveShadow = true; scene.add(road);

  const grassTex = canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = '#6f944b'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 2600; i++) { g.strokeStyle = ['#5d8240', '#80a85a', '#678c45', '#8db365'][i % 4]; g.lineWidth = 1.2; const x = rnd() * w, y = rnd() * h; g.beginPath(); g.moveTo(x, y); g.lineTo(x + rr(-2, 2), y - rr(3, 7)); g.stroke(); }
  }, 20, 40);
  const grass = new THREE.Mesh(new THREE.PlaneGeometry(100, 200).rotateX(-Math.PI / 2), mat(0xffffff, { map: grassTex, roughness: 1 }));
  grass.position.set(-1.7 - 50, 0, 0); grass.receiveShadow = true; scene.add(grass);

  const sandTex = canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = '#e2cc9a'; g.fillRect(0, 0, w, h);
    speckle(g, w, h, 5000, ['#d4bb86', '#efdcb0', '#c9ae78', '#f3e4c2']);
  }, 2, 40);
  const sandGeo = new THREE.PlaneGeometry(10.4, 200, 24, 1).rotateX(-Math.PI / 2);
  { const p = sandGeo.attributes.position; for (let i = 0; i < p.count; i++) { const x = p.getX(i) + 6.8; p.setY(i, -(x - 1.7) * 0.072); } sandGeo.computeVertexNormals(); }
  const sand = new THREE.Mesh(sandGeo, mat(0xffffff, { map: sandTex, roughness: 1 }));
  sand.position.x = 6.8; sand.receiveShadow = true; scene.add(sand);

  const curbMat = flat(0xd8d3c4);
  for (const x of [-1.66, 1.66]) { const c = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.1, 200), curbMat); c.position.set(x, 0.05, 0); c.receiveShadow = true; scene.add(c); }

  // sea
  const seaGeo = new THREE.PlaneGeometry(150, 200, 75, 90).rotateX(-Math.PI / 2);
  seaGeo.translate(6 + 75, 0, 0);
  const seaBase = Float32Array.from(seaGeo.attributes.position.array);
  const sea = new THREE.Mesh(seaGeo, flat(0x2f8f95, { roughness: 0.28, metalness: 0.12, transparent: true, opacity: 0.94 }));
  sea.position.y = -0.3; sea.receiveShadow = true; scene.add(sea);
  const foam = new THREE.Mesh(new THREE.PlaneGeometry(0.6, 200).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.6, depthWrite: false }));
  foam.position.set(6, -0.27, 0); scene.add(foam);
  function waveH(x, z, t) {
    const amp = 0.35 + Math.min((x - 6) / 25, 1) * 0.9;
    return amp * (0.06 * Math.sin(0.45 * x + t * 1.3 + 0.25 * z) + 0.04 * Math.sin(0.9 * z - t * 0.9 + x * 0.21) + 0.025 * Math.sin(1.7 * x + 1.3 * z + t * 2.1));
  }
  function updateSea(t, dist) {
    const p = seaGeo.attributes.position.array;
    for (let i = 0; i < p.length; i += 3) p[i + 1] = waveH(seaBase[i], seaBase[i + 2] + dist, t);
    seaGeo.attributes.position.needsUpdate = true;
    seaGeo.computeVertexNormals();
  }

  // ---------- scrolling props ----------
  const scrollers = [];
  const addScroll = (obj, min, max, factor = 1) => { scrollers.push({ obj, min, max, factor }); scene.add(obj); return obj; };
  const shadowAll = (o) => { o.traverse((c) => { if (c.isMesh) { c.castShadow = true; c.receiveShadow = true; } }); return o; };

  const lampBulbMat = mat(0xfff1cf, { emissive: 0xffc46b, emissiveIntensity: 0 });
  const glowTex = glowTexture('rgba(255,226,160,1)', 'rgba(255,190,90,0.35)');
  const lampGlows = [], lampPools = [];
  const poleMat = flat(0x2c3a44, { metalness: 0.4, roughness: 0.5 });
  function makeLamp() {
    const g = new THREE.Group();
    const pole = new THREE.Mesh(cylGeo(0.035, 0.06, 8), poleMat); pole.scale.y = 3.3; pole.position.y = 1.65; g.add(pole);
    const arm = new THREE.Mesh(cylGeo(0.025, 0.025, 6), poleMat); arm.scale.y = 0.7; arm.rotation.z = -Math.PI / 2 + 0.15; arm.position.set(0.33, 3.25, 0); g.add(arm);
    const hood = new THREE.Mesh(new THREE.ConeGeometry(0.16, 0.12, 10), poleMat); hood.position.set(0.66, 3.25, 0); g.add(hood);
    const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.075, 10, 8), lampBulbMat); bulb.position.set(0.66, 3.17, 0); g.add(bulb);
    const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: 0xffd08a, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0 }));
    glow.position.copy(bulb.position); glow.scale.set(1.8, 1.8, 1); g.add(glow); lampGlows.push(glow);
    const pool = new THREE.Mesh(new THREE.CircleGeometry(1.9, 24).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ map: glowTex, color: 0xffc070, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0 }));
    pool.position.set(0.9, 0.02, 0); g.add(pool); lampPools.push(pool);
    return shadowAll(g);
  }
  for (let z = -90; z < 90; z += 15) { const l = makeLamp(); l.position.set(-1.95, 0, z); addScroll(l, -90, 90); }

  const trunkMat = flat(0x8a6a48), leafMat = flat(0x3f8a45, { side: THREE.DoubleSide }), leafMat2 = flat(0x5aa04f, { side: THREE.DoubleSide }), nutMat = flat(0x5b3d22);

    } else {
      if (state.cam === 'follow') { camGoal.set(bx + 3.1, 1.75, 2.7); lookGoal.set(bx, 1.05, 0); }
      else if (state.cam === 'side') { camGoal.set(bx + 4.6, 1.15, 0.1); lookGoal.set(bx, 0.95, 0.1); }
      else if (state.cam === 'cine') { cineA += rdt * (reduceMotion ? 0.05 : 0.18); camGoal.set(bx + Math.sin(cineA) * 5, 1.4 + Math.sin(cineA * 0.7) * 0.8, Math.cos(cineA) * 5); lookGoal.set(bx, 1.1, 0); }
      else if (state.cam === 'pov') { camGoal.copy(headW).add(tmpV.set(0, 0.16, -0.12)); lookGoal.set(bx, 1.2, 14); }
      const k = state.cam === 'pov' ? 1 - Math.exp(-rdt * 20) : 1 - Math.exp(-rdt * 3);
      camera.position.lerp(camGoal, k);
      lookCur.lerp(lookGoal, k);
      camera.lookAt(lookCur);
    }
    sky.position.copy(camera.position); skyU.cam.value.copy(camera.position);
    stars.position.copy(camera.position);

    // audio
    if (audio && soundOn) {
      const t = audio.ctx.currentTime;
      audio.wind.g.gain.setTargetAtTime(Math.min(0.18, v * 0.013), t, 0.3);
      audio.wind.f.frequency.setTargetAtTime(400 + v * 60, t, 0.3);
      audio.waves.g.gain.setTargetAtTime(0.06 + 0.05 * Math.sin(rt * 0.8), t, 0.5);
    }

    // HUD
    hudT -= rdt;
    if (hudT < 0) {
      hudT = 0.12;
      $('#sSpeed').firstChild.textContent = (v * 3.6).toFixed(0);
      $('#sCad').firstChild.textContent = (v / R / 2.4 * 60 / (2 * Math.PI)).toFixed(0);
      $('#sDist').firstChild.textContent = (state.dist / 1000).toFixed(2);
      $('#sFish').firstChild.textContent = state.fish;
      $('#sTime').textContent = fmtTime(state.tod);
    }

    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }

  function start(saved) {
    if (saved && typeof saved === 'object') {
      if (Number.isFinite(saved.fish)) state.fish = saved.fish;
      if (Number.isFinite(saved.dist)) state.dist = saved.dist;
      if (Number.isFinite(saved.tod)) state.tod = saved.tod;
      if (Number.isFinite(saved.targetKmh)) state.targetKmh = saved.targetKmh;
    }
    if (reduceMotion && !(saved && saved.targetKmh)) state.targetKmh = 14;
    setSpeed(state.targetKmh);
    v = state.targetKmh / 3.6;
    todIn.value = state.tod; $('#todOut').textContent = fmtTime(state.tod);
    applyTime(state.tod);
    setCam(saved && saved.cam && saved.cam !== 'free' ? saved.cam : 'follow');
    setTimeout(() => toast('按空格，让鹈鹕接条鱼'), 900);
    requestAnimationFrame(frame);
  }
  window.claude?.hot?.snapshot?.(() => ({ fish: state.fish, dist: state.dist, tod: state.tod, targetKmh: state.targetKmh, cam: state.cam }));
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>

</html>
